            Welcome to Nascon Technologies. Since 2012, Nascon Technologies delivers innovative industrial automation solutions, custom engineered electrical control panels, and authorized supply of genuine industrial automation products for modern manufacturing and continuous process industries.

          <section>
            <h2>Industrial Automation & Engineering Control Solutions</h2>
            <p>
              Nascon Technologies integrates cutting-edge automation, electrical power distribution, intelligent instrumentation, and IoT monitoring technologies into high-performance industrial control solutions. Our engineering team designs and manufactures robust systems suited to demanding factory environments.
            </p>
            <ul>
              <li><strong>Custom Control Panel Manufacturing:</strong> Turnkey PLC Control Panels, VFD Panels, MCC, and PCC panels engineered to exact application specifications. <a href="/solutions">Learn more about our control panel solutions</a>.</li>
              <li><strong>Process Automation & System Integration:</strong> Complete machine automation, HMI visualization, SCADA architecture, and variable frequency drives integration. <a href="/products">Explore industrial automation products</a>.</li>
              <li><strong>Authorized Industrial Product Distribution:</strong> Genuine industrial automation components, switchgear, relays, and cables from trusted global manufacturers. <a href="/partners">View our authorized technology partners</a>.</li>
              <li><strong>IoT & Remote Monitoring Solutions:</strong> Cloud-connected monitoring systems delivering operational data, real-time analytics, uptime tracking, and predictive maintenance alerts.</li>
            </ul>
          </section>
