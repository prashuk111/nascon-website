          <h1>Nascon Technologies – Industrial Automation & Control Panels</h1>
          <p>
            Welcome to Nascon Technologies. Since 2012, Nascon Technologies delivers innovative industrial automation solutions, custom engineered electrical control panels, and authorized supply of genuine industrial automation products for modern manufacturing plants and continuous process facilities across India.
          </p>

          <img 
            src="/images/hero.webp" 
            alt="Nascon Technologies Industrial Automation Solutions and Control Panels" 
            width="600" 
            height="400" 
          />

          <section>
            <h2>Industrial Automation & Engineering Control Solutions</h2>
            <p>
              Nascon Technologies integrates cutting-edge automation, electrical power distribution, intelligent instrumentation, and IoT monitoring technologies into high-performance industrial control solutions. Our engineering team designs, manufactures, tests, and commissions robust automation systems suited to demanding factory environments.
            </p>
            <ul>
              <li><strong>Custom Control Panel Manufacturing:</strong> Turnkey PLC Control Panels, Variable Frequency Drive (VFD) Panels, Motor Control Centers (MCC), and Power Control Centers (PCC) engineered to exact application specifications and international safety standards. <a href="/solutions">Learn more about our custom control panel solutions</a>.</li>
              <li><strong>Process Automation & System Integration:</strong> Complete machine automation, Human-Machine Interface (HMI) visualization, Supervisory Control and Data Acquisition (SCADA) architecture, and industrial variable frequency drives integration. <a href="/products">Explore industrial automation products</a>.</li>
              <li><strong>Authorized Industrial Product Distribution:</strong> Genuine industrial automation components, low voltage switchgear, relays, circuit breakers, sensors, and specialized cables from trusted global manufacturers. <a href="/partners">View our authorized technology partners</a>.</li>
              <li><strong>IoT & Remote Monitoring Solutions:</strong> Cloud-connected monitoring systems delivering operational machine data, real-time analytics, plant uptime tracking, and predictive maintenance alerts.</li>
            </ul>
          </section>

          <section>
            <h2>Authorized Brand Partners & Product Supply</h2>
            <p>
              We collaborate closely with leading global automation and electrical technology brands to ensure maximum reliability and genuine component sourcing for our industrial clients:
            </p>
            <ul>
              <li><a href="/partners/schneider">Schneider Electric Automation, Switching & Protection Products</a></li>
              <li><a href="/partners/siemens">Siemens PLCs, HMIs & Industrial Variable Speed Drives</a></li>
              <li><a href="/partners/phoenix">Phoenix Contact Interface, Power Supplies & Connectivity</a></li>
              <li><a href="/partners/multispan">Multispan Digital Process Indicators, Temperature Controllers & Timers</a></li>
              <li><a href="/partners/selec">Selec Energy Meters, Timers & Electronic Control Relays</a></li>
              <li><a href="/partners/finolex">Finolex Industrial Flexible & Multi-Core Control Cables</a></li>
              <li><a href="/partners/gloster">Gloster Power, Armoured & Instrumentation Cables</a></li>
            </ul>
          </section>

          <section>
            <h2>Diverse Industries We Serve</h2>
            <p>
              Our application-driven automation engineering empowers diverse manufacturing sectors with reliable performance, reduced machine downtime, and high operational safety standards:
            </p>
            <p>
              Automotive Assembly & Parts Manufacturing, Food & Beverage Processing Facilities, Water & Wastewater Treatment Plants, Energy & Power Utilities, Pharmaceutical Formulation & Cleanrooms, Packaging Machinery, Chemical Plants, and Critical Infrastructure Projects. <a href="/industries">Discover our industry applications</a>.
            </p>
          </section>

          <section>
            <h2>Quality Engineering, Testing & Commissioning</h2>
            <p>
              Every control panel and automation system delivered by Nascon Technologies undergoes rigorous quality checks, wiring continuity testing, insulation resistance validation, and full functional simulation before site dispatch. Our dedicated field engineers provide comprehensive on-site installation, commissioning, and lifecycle maintenance support.
            </p>
          </section>

          <section>
            <h2>Request an Engineering Consultation & Quote</h2>
            <p>
              Partner with Nascon Technologies for your next factory automation project, control panel retrofit, or genuine component procurement. Our engineering team is ready to assist you with technical recommendations and competitive pricing.
            </p>
